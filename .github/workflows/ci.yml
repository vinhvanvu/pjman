# Every push to main and every pull request (decision repo-hygiene/guardrails), on Node 24, the one Node the package
# supports. Two jobs per package (decision ci-checks/job-names): check runs everything short of running the code
# (compile or typecheck, lint, format; the dashboard also builds, since the package ships it built), test runs the tests.
# npm ci compiles the CLI through its prepare script; the dashboard's contract types come from those declarations.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-check:
    name: cli / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: compile
        run: npm run build
      - name: lint
        run: npm run lint
      - name: format
        run: npm run fmt:check

  cli-test:
    name: cli / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # the tests write stores that commit to git
      - run: git config --global user.name "pjman ci" && git config --global user.email "ci@pjman.invalid"
      - run: npm ci
      - name: test
        run: npm test

  dashboard-check:
    name: dashboard / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui
      - name: typecheck
        run: npm --prefix ui run typecheck
      - name: lint
        run: npm --prefix ui run lint
      - name: format
        run: npm --prefix ui run fmt:check
      - name: build
        run: npm --prefix ui run build

  dashboard-test:
    name: dashboard / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui
      - name: test
        run: npm --prefix ui run test
