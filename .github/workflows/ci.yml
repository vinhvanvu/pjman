# Every push to main and every pull request (decision repo-hygiene/guardrails): on Node 24, the one Node the package
# supports, the tool is linted, format-checked and tested, and the dashboard is typechecked, linted, format-checked,
# tested and built (the package ships it built).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool:
    name: tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # the tests write stores that commit to git
      - run: git config --global user.name "pjman ci" && git config --global user.email "ci@pjman.invalid"
      - run: npm ci
      - name: lint, format, test
        run: npm run check

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      # the dashboard's contract types come from the tool's built declarations
      - run: npm ci
      - run: npm ci --prefix ui
      - name: typecheck, lint, format, test
        run: npm --prefix ui run check
      - name: build
        run: npm --prefix ui run build
